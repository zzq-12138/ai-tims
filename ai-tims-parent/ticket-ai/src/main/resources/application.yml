server:
  port: 8104

spring:
  application:
    name: ticket-ai
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ===== M0 骨架仅保留最小配置；Spring AI 与中间件 M5 起启用，密钥一律走环境变量，严禁硬编码 =====
