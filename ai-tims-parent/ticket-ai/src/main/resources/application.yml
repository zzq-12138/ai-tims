server:
  port: 8104

spring:
  application:
    name: ticket-ai
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}       # Sa-Token 会话共享（与 ticket-system/order 同一 Redis）
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aitims}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:}          # 必填，无默认值（~/secrets/mysql_pwd 由启动脚本注入）
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

sa-token:
  token-name: Authorization               # 与 ticket-system/order 一致，只读登录态
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-log: false

tims:
  # 服务间调用共享密钥：与 ticket-knowledge 同源；留空时回填投递默认跳过
  internal-token: ${TIMS_INTERNAL_TOKEN:}
  ai:
    # ===== 主模型（对话/助手/Agent）：默认 glm-5.3-flash（有 5000 万专属包）=====
    # 注意：知识库 KB v1 的 320 条抽取记录（ai_extracted，均为 glm-4-flash；其中 310 条 PUBLISHED）已冻结不重抽；
    #       检索类结论（E1–E8 消融、门控 B0、阈值评估、正负样本打分）口径不变。
    model: ${LLM_CHAT_MODEL:glm-5.3-flash}
    # ===== 抽取模型：默认 glm-5.3-flash（S3 实验口径）=====
    # S1 基线 = glm-4-flash 的 316 条现成抽取数据（不再重跑）；S3 = glm-5.3-flash，同标注集对比。
    # 若把 S3 产物写回线上 KB，则 KB v2 生效，检索类指标必须整链重跑。
    extract-model: ${LLM_EXTRACT_MODEL:glm-5.3-flash}
    extract-max-tokens: ${LLM_EXTRACT_MAX_TOKENS:4096}
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    completions-path: ${LLM_COMPLETIONS_PATH:/chat/completions}
    # 密钥优先读环境变量，否则读文件（600 权限，严禁入库/入 Git）
    api-key: ${LLM_API_KEY:}
    api-key-file: ${LLM_API_KEY_FILE:/home/dev/secrets/zhipu_api_key}
    # 推理模型 reasoning 先耗 token，输出上限必须 ≥8192，否则只剩思考没有答案
    max-tokens: ${LLM_MAX_TOKENS:8192}
    temperature: ${LLM_TEMPERATURE:0.3}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:120000}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
    kb-base-url: ${KB_BASE_URL:http://ticket-knowledge}
    order-base-url: ${ORDER_BASE_URL:http://ticket-order}
    top-k: ${LLM_RAG_TOPK:5}
    snippet-chars: ${LLM_SNIPPET_CHARS:500}
    # ===== AI 应用层护栏（默认全关，保持现有接口契约与行为）=====
    # 打开：AI_GUARD_ENABLED=true；打开后可按子开关裁剪
    guard:
      enabled: ${AI_GUARD_ENABLED:false}
      injection-enabled: ${AI_GUARD_INJECTION:true}
      injection-threshold: ${AI_GUARD_THRESHOLD:0.5}
      mask-input: ${AI_GUARD_MASK_INPUT:true}          # 送模型前脱敏手机号/身份证/邮箱/姓名/地址
      mask-tool-output: ${AI_GUARD_MASK_TOOL:true}     # 工具结果送模型前脱敏
      output-enabled: ${AI_GUARD_OUTPUT:true}          # 输出过滤：系统提示词泄露/凭据/堆栈
      mask-output: ${AI_GUARD_MASK_OUTPUT:true}        # 输出 PII 脱敏
    # ===== AI 应用层模型路由（默认关闭）：简单问题走小模型，复杂问题走大模型 =====
    # 打开：AI_ROUTER_ENABLED=true；分流依据为长度/多跳/推理词/工具/历史轮次等可解释信号
    router:
      enabled: ${AI_ROUTER_ENABLED:false}
      simple-model: ${AI_ROUTER_SIMPLE_MODEL:glm-4-flash}
      complex-model: ${AI_ROUTER_COMPLEX_MODEL:glm-5.3-flash}
      threshold: ${AI_ROUTER_THRESHOLD:0.5}
    # ===== AI 应用层语义缓存（默认关闭）：精确 hash + embedding 余弦相似度 =====
    # 打开：AI_CACHE_ENABLED=true；关闭时不调 embedding、不改响应，行为与改动前一致
    cache:
      enabled: ${AI_CACHE_ENABLED:false}
      threshold: ${AI_CACHE_THRESHOLD:0.92}      # 余弦相似度阈值，≥ 才算命中
      ttl-seconds: ${AI_CACHE_TTL_SECONDS:86400}
      max-entries: ${AI_CACHE_MAX_ENTRIES:2000}  # 单租户条目上限
      embedding-model: ${AI_CACHE_EMBEDDING_MODEL:embedding-3}
      embeddings-path: ${AI_CACHE_EMBEDDINGS_PATH:/embeddings}
      min-question-chars: ${AI_CACHE_MIN_QUESTION_CHARS:6}
      embedding-timeout-ms: ${AI_CACHE_EMBEDDING_TIMEOUT_MS:3000}
    # ===== C 档兜底建议（默认关闭）：门控判 C 时让大模型给自由建议，并记录“建议-处置”配对 =====
    # 打开：AI_FALLBACK_ENABLED=true；关闭时不改 prompt、不落库、不新增返回字段
    fallback:
      enabled: ${AI_FALLBACK_ENABLED:false}
      # 新口径（处置侧覆盖率）判定线：0.60 判“一致”，有效片段 <3 记“样本不足”
      consistent-threshold: ${AI_FALLBACK_CONSISTENT_THRESHOLD:0.60}
      min-segments: ${AI_FALLBACK_MIN_SEGMENTS:3}
      # 建议→回填→入库（默认关闭）：只投递 ai_extracted 待审，人审通过才进知识库
      # 灰度 = enabled + gray-ratio（按 pairId 稳定抽样）+ 服务端日上限，三者同时满足才投递
      intake:
        enabled: ${AI_FALLBACK_INTAKE_ENABLED:false}
        gray-ratio: ${AI_FALLBACK_INTAKE_GRAY_RATIO:0.0}
        min-confidence: ${AI_FALLBACK_INTAKE_MIN_CONFIDENCE:0.60}
    # 问题9：无官方余额接口，按调用记录本地计量（费用=token×单价），页面标注“估算”
    budget-cny: ${LLM_BUDGET_CNY:18}
    # 缺省单价（元/千 tokens）：取 glm-5.3-flash 标准价，避免切模型后低估
    price-input-per-1k: ${LLM_PRICE_INPUT_PER_1K:0.0008}
    price-output-per-1k: ${LLM_PRICE_OUTPUT_PER_1K:0.0028}
    # 分模型单价（元/千 tokens），来源：智谱开放平台定价页「元/百万 Tokens」折算
    # glm-4-flash 0.1 元/百万（扣“通用按 token 包”，控制台实测有消耗）；
    # glm-5.3-flash 标准价 输入 0.8 / 输出 2.8 元/百万（有专属资源包）
    model-prices:
      glm-4-flash: { input-per-1k: 0.0001, output-per-1k: 0.0001 }
      glm-4.7-flash: { input-per-1k: 0.0001, output-per-1k: 0.0001 }
      glm-5.3-flash: { input-per-1k: 0.0008, output-per-1k: 0.0028 }
      glm-5.3-flashx: { input-per-1k: 0.0008, output-per-1k: 0.0028 }
      # embedding-3：已购 5000 万 tokens 专属资源包（预付），不再扣通用包，故通用包口径按 0 计；
      # 其 token 量单独计入「专属包」口径展示。如后续按量计费，改这两行为 0.0005/0 即可。
      embedding-3: { input-per-1k: 0.0, output-per-1k: 0.0 }

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.tims.ai: info
