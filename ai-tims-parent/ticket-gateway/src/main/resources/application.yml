server:
  port: 8080

spring:
  application:
    name: ticket-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
    gateway:
      # M1 起接入 Nacos 注册中心，lb:// 路由已启用（任务书 3.2 路由表）。
      # 下游服务直接暴露 /api/{svc}/** 全路径，网关不剥前缀。
      routes:
        - id: system
          uri: lb://ticket-system
          predicates: [ "Path=/api/system/**" ]
        - id: orde
          uri: lb://ticket-order
          predicates: [ "Path=/api/order/**" ]
        - id: kb
          uri: lb://ticket-knowledge
          predicates: [ "Path=/api/kb/**" ]
        - id: ai
          uri: lb://ticket-ai
          predicates: [ "Path=/api/ai/**" ]
        - id: push
          uri: lb://ticket-push
          predicates: [ "Path=/api/push/**" ]
        - id: ws
          uri: lb:ws://ticket-push
          predicates: [ "Path=/ws/**" ]

management:
  endpoints:
    web:
      exposure:
        include: health,info
