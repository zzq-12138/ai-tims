server:
  port: 8103

spring:
  application:
    name: ticket-knowledge
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aitims}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:}          # 必填，无默认值（~/secrets/mysql_pwd 注入）
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}       # Sa-Token 会话共享
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tims}
    password: ${RABBIT_PASSWORD:}         # 必填，~/secrets/rabbit_pwd 注入
    listener:
      simple:
        concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization               # 必须与 ticket-system 一致，会话共享
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-log: false

tims:
  kb:
    embedding:
      # 智谱 embedding-3：维度 1024（平衡精度与 Milvus 内存），key 从环境变量注入
      api-url: ${ZHIPU_EMBEDDING_URL:https://open.bigmodel.cn/api/paas/v4/embeddings}
      api-key: ${ZHIPU_API_KEY:}
      model: embedding-3
      dimensions: 1024
      # 单条文本截断长度（embedding-3 上限 8192 tokens，留余量）
      max-text-length: 4000
    milvus:
      host: ${MILVUS_HOST:127.0.0.1}
      port: ${MILVUS_PORT:19530}
      collection: kb_knowledge_vec
    sync:
      interval-ms: 10000                  # 同步扫描间隔（发布后 30s 内可检索的保障）
      batch-size: 16                      # 单批向量化条数（embedding-3 批量上限内）
    extract:
      # M6 工单关闭 → 知识抽取 → 审核闭环
      queue: q.kb.extract
      exchange: tims.ticket.event
      routing-key: ticket.closed
      dead-queue: q.kb.extract.dead
      ai-base-url: ${AI_BASE_URL:http://ticket-ai}
      order-base-url: ${ORDER_BASE_URL:http://ticket-order}
      model: ${LLM_EXTRACT_MODEL:glm-4-flash}
      # 相似度仅用于“建议”，绝不自动合并：≥0.92 建议合并，≥0.98 建议跳过，其余建议新建
      dedup-threshold: 0.92
      dedup-skip-threshold: 0.98
      top-k: 5
      executor:
        # 抽取异步执行器（与 MQ 消费线程解耦）：默认 core 16 / max 32，与既有消费并发口径一致
        core-size: ${KB_EXTRACT_POOL_CORE:16}
        max-size: ${KB_EXTRACT_POOL_MAX:32}
        # 有界队列，避免集中关单高峰无界堆积；队列满后默认 CallerRunsPolicy 提供背压
        queue-capacity: ${KB_EXTRACT_POOL_QUEUE:200}
        keep-alive-seconds: ${KB_EXTRACT_POOL_KEEPALIVE:60}
        rejection-policy: ${KB_EXTRACT_POOL_REJECTION:CallerRunsPolicy}
        # 抽取失败仅即时重试 1 次（不做退避自动重试）
        retry-once: ${KB_EXTRACT_RETRY_ONCE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
