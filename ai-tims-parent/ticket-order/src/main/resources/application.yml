server:
  port: 8102

spring:
  application:
    name: ticket-order
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aitims}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:}          # 必填，无默认值（~/.secrets/mysql_pwd 注入）
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}       # Sa-Token 会话共享 + 工单流水号 + 指标最新值
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tims}
    password: ${RABBIT_PASSWORD:}          # 必填，无默认值（~/.secrets 不进 git，重启脚本注入）
    virtual-host: /
    publisher-confirm-type: correlated     # 发送确认（nack/不可达时走 HTTP 降级）
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 20MB                 # 附件单文件上限（与 AttachmentService 校验一致）
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization               # 必须与 ticket-system 一致，会话共享
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-log: false

tims:
  order:
    # 派发兜底默认值班人（§4.3：无规则匹配时落到该用户，工单停留 SUBMITTED）
    default-handler: ${TIMS_DEFAULT_HANDLER:1}
    # 单次批量建单上限（模拟器接口护栏）
    mock-batch-max: 500
  attachment:
    # 附件存储根目录（VM 本地盘，按月分目录，存储名 uuid.ext 防路径穿越）
    storage-dir: ${TIMS_ATTACHMENT_DIR:/home/dev/data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
