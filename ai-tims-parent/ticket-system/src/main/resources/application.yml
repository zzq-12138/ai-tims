server:
  port: 8101

spring:
  application:
    name: ticket-system
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ===== M0 骨架仅保留最小配置；中间件连接 M1 起启用，一律走环境变量，严禁硬编码 =====
