server:
  port: 8101

spring:
  application:
    name: ticket-system
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aitims}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:}          # 必填，无默认值（~/.secrets/mysql_pwd 注入）
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}       # Sa-Token 会话存储
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.qq.com
    port: 465
    username: 812014285@qq.com
    password: ${SMTP_AUTH:}               # 授权码：~/secrets/smtp_auth 注入（不进 git）
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# 验证码发信：mock=开发默认（写日志+调试接口取码）；smtp=真实发信（M2 验证）
tims:
  verification:
    sender: ${VERIFY_SENDER:mock}
    mail:
      from: 812014285@qq.com
      from-name: AI-TIMS 系统

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization               # 前端 header：Authorization: <token>
  timeout: 2592000                        # 30 天
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false                   # 仅走 header，防 CSRF
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
