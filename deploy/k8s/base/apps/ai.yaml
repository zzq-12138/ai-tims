# AI 服务 :8104（Spring AI / GLM；当前骨架最小配置）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-ai-config
  labels:
    app: ticket-ai
data:
  SERVER_PORT: "8104"
  LLM_CHAT_MODEL: glm-4-flash
  SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: glm-4-flash
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-ai
  labels:
    app: ticket-ai
spec:
  selector:
    app: ticket-ai
  ports:
    - name: http
      port: 8104
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-ai
  labels:
    app: ticket-ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ticket-ai
  template:
    metadata:
      labels:
        app: ticket-ai
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tims-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: ai
          image: registry.company.internal/ai-tims/ticket-ai:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8104
          envFrom:
            - configMapRef:
                name: tims-common-config
            - configMapRef:
                name: ticket-ai-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: LLM_API_KEY
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
