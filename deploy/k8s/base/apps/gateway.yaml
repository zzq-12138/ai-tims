# 网关 :8080（仓库实际端口，不是任务书里的 8080/8081 旧口径）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-gateway-config
  labels:
    app: ticket-gateway
data:
  SERVER_PORT: "8080"
  SPRING_DATA_REDIS_DATABASE: "0"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-gateway
  labels:
    app: ticket-gateway
spec:
  selector:
    app: ticket-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-gateway
  labels:
    app: ticket-gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ticket-gateway
  template:
    metadata:
      labels:
        app: ticket-gateway
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tims-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gateway
          image: registry.company.internal/ai-tims/ticket-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tims-common-config
            - configMapRef:
                name: ticket-gateway-config
          env:
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
