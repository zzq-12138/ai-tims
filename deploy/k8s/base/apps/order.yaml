# 工单服务 :8102（含附件，单副本 + Recreate，避免 RWO PVC 滚动时双挂载）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-order-config
  labels:
    app: ticket-order
data:
  SERVER_PORT: "8102"
  TIMS_ATTACHMENT_DIR: /data/uploads
  TIMS_DEFAULT_HANDLER: "1"
  TIMS_ORDER_MOCK_BATCH_MAX: "500"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tims-order-uploads
  labels:
    app: ticket-order
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-order
  labels:
    app: ticket-order
spec:
  selector:
    app: ticket-order
  ports:
    - name: http
      port: 8102
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-order
  labels:
    app: ticket-order
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ticket-order
  template:
    metadata:
      labels:
        app: ticket-order
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tims-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: order
          image: registry.company.internal/ai-tims/ticket-order:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8102
          envFrom:
            - configMapRef:
                name: tims-common-config
            - configMapRef:
                name: ticket-order-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: MYSQL_PASSWORD
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: tims-order-uploads
