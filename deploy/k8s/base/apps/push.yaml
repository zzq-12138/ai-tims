# 推送服务 :8105（WebSocket / 站内信；当前骨架最小配置）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-push-config
  labels:
    app: ticket-push
data:
  SERVER_PORT: "8105"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-push
  labels:
    app: ticket-push
spec:
  selector:
    app: ticket-push
  ports:
    - name: http
      port: 8105
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-push
  labels:
    app: ticket-push
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ticket-push
  template:
    metadata:
      labels:
        app: ticket-push
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tims-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: push
          image: registry.company.internal/ai-tims/ticket-push:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8105
          envFrom:
            - configMapRef:
                name: tims-common-config
            - configMapRef:
                name: ticket-push-config
          env:
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
