# Redis 7 单实例。密码来自 Secret；为空时启动脚本自动不启用 requirepass，
# 服务侧通过 SPRING_DATA_REDIS_PASSWORD 注入同一密码。
apiVersion: v1
kind: Service
metadata:
  name: tims-redis
  labels:
    app: tims-redis
spec:
  clusterIP: None
  selector:
    app: tims-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tims-redis
  labels:
    app: tims-redis
spec:
  serviceName: tims-redis
  replicas: 1
  selector:
    matchLabels:
      app: tims-redis
  template:
    metadata:
      labels:
        app: tims-redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: registry.company.internal/ai-tims/redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -n "${REDIS_PASSWORD:-}" ]; then
                exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
              fi
              exec redis-server --appendonly yes
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tims-app-secret
                  key: REDIS_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
