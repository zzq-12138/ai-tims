# =====================================================================
# Secret 模板：只含占位符，严禁把真实密码写进仓库。
# 本文件故意不列入 kustomization.yaml，避免误 apply 出占位符 Secret。
#
# 推荐注入方式（不进 shell history 时可用文件方式）：
#   kubectl -n ai-tims create secret generic tims-app-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD='...' \
#     --from-literal=MYSQL_PASSWORD='...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=RABBIT_PASSWORD='...' \
#     --from-literal=RABBITMQ_ERLANG_COOKIE='...' \
#     --from-literal=NACOS_AUTH_TOKEN="$(openssl rand -base64 32)" \
#     --from-literal=NACOS_AUTH_IDENTITY_KEY=serverIdentity \
#     --from-literal=NACOS_AUTH_IDENTITY_VALUE='...' \
#     --from-literal=NACOS_PASSWORD='...' \
#     --from-literal=MINIO_ROOT_USER='...' \
#     --from-literal=MINIO_ROOT_PASSWORD='...' \
#     --from-literal=LLM_API_KEY='...' \
#     --from-literal=ZHIPU_API_KEY='...' \
#     --from-literal=SMTP_AUTH='...'
#
# 或：复制本文件为 secret.yaml（已被 .gitignore 的 deploy/k8s/**/secret.yaml 规则忽略），
#     替换所有 REPLACE_ME 后 kubectl apply -f secret.yaml。
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tims-app-secret
  namespace: ai-tims
  labels:
    app.kubernetes.io/part-of: ai-tims
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_ME
  MYSQL_PASSWORD: REPLACE_ME
  REDIS_PASSWORD: REPLACE_ME
  RABBIT_PASSWORD: REPLACE_ME
  # RabbitMQ 节点间认证，多副本时必须一致；单副本也必须显式设置
  RABBITMQ_ERLANG_COOKIE: REPLACE_ME
  # Nacos 3 启动脚本强制要求该值（Base64 且 >= 32 字节），即使关闭鉴权
  NACOS_AUTH_TOKEN: REPLACE_ME
  NACOS_AUTH_IDENTITY_KEY: serverIdentity
  NACOS_AUTH_IDENTITY_VALUE: REPLACE_ME
  NACOS_PASSWORD: REPLACE_ME
  MINIO_ROOT_USER: REPLACE_ME
  MINIO_ROOT_PASSWORD: REPLACE_ME
  LLM_API_KEY: REPLACE_ME
  ZHIPU_API_KEY: REPLACE_ME
  SMTP_AUTH: REPLACE_ME
