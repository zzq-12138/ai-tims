# 开发机专属地址。base 的 common-configmap 保持公司值不动，这里只覆盖差异项。
# 注意：这里是 strategic merge，只写需要改的 key，未列出的 key 保留 base 值。
apiVersion: v1
kind: ConfigMap
metadata:
  name: tims-common-config
data:
  # Nacos 用 compose 里的 tims-nacos（宿主机 8848）；开发机没有公司那套命名空间 ID
  NACOS_ADDR: 192.168.40.10:8848
  NACOS_NAMESPACE: ""

  # MySQL 用宿主机 mysql.service（已改 bind-address=0.0.0.0，并给 dev@10.42.% 授权）
  MYSQL_HOST: 192.168.40.10
  MYSQL_PORT: "3306"
  MYSQL_DB: aitims
  MYSQL_USER: dev

  # 模型：开发机仍然走智谱云（与 start_all.sh 口径一致）
  LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4
  LLM_CHAT_MODEL: glm-5.3-flash
  ZHIPU_EMBEDDING_URL: https://open.bigmodel.cn/api/paas/v4/embeddings
