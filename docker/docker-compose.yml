# AI-TIMS 本地中间件（P0 阶段 compose 形态；M8 起 manifests 化）
# 用法：docker compose up -d
# 注意：密码/密钥一律走环境变量注入，本文件不含敏感信息。

services:
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: tims-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false        # Nacos 3 启动脚本强制要求 AUTH_TOKEN（Base64, >=32 字节），即使鉴权关闭。
        # 开发期固定示例值，生产必须替换：openssl rand -base64 32
      - NACOS_AUTH_TOKEN=ZGV2LXRpbXMtZGV2LXRpbXMtZGV2LXRpbXMtZGV2LXRpbXMtZGV2LTEyMzQ=
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=tims-dev        # 开发期关闭鉴权；上生产/K8s 时改 true 并注入 NACOS_AUTH_TOKEN/IDENTITY
      - JVM_XMS=256m
      - JVM_XMX=512m
    ports:
      - "8848:8848"                    # HTTP OpenAPI / 控制台后端
      - "9848:9848"                    # gRPC（客户端端口 = 8848 + 1000，必须一并映射）
      - "8849:8080"                    # Nacos 3 控制台 UI（容器内 8080，避开宿主机网关端口）
    volumes:
      - nacos-data:/home/nacos/data    # 内嵌 derby 持久化（毕设规模够用；MySQL 存储留作优化项）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tims-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # -----------------------------------------------------------------
  # Milvus standalone 三件套（M3 知识向量检索；内存按台账预算）
  #   milvus 1536M / etcd 256M / minio 256M，VM 总内存 16G 余量充足
  # -----------------------------------------------------------------
  etcd:
    # VM 镜像源对 milvusdb/etcd 无缓存，用 quay 官方 etcd（Milvus 2.4 兼容 v3.5.14）
    image: quay.io/coreos/etcd:v3.5.14
    container_name: tims-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    mem_limit: 256m
    volumes:
      - etcd-data:/etcd
    restart: unless-stopped

  minio:
    image: milvusdb/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: tims-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin       # 开发期固定；生产注入环境变量
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio-data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: tims-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    mem_limit: 1536m
    ports:
      - "19530:19530"                    # gRPC（Java SDK）
      - "9091:9091"                      # 健康检查 / metrics
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # -----------------------------------------------------------------
  # RabbitMQ（P0 补做：后续事件流/异步任务用）
  #   AMQP 5672；管理台 15672 映射宿主机；内存 350M
  # -----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tims-rabbitmq
    hostname: tims-rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=tims      # 开发期固定；生产注入环境变量
      - RABBITMQ_DEFAULT_PASS=tims123   # 开发期固定；生产注入环境变量
    mem_limit: 350m
    ports:
      - "5672:5672"                      # AMQP
      - "15672:15672"                    # 管理台 UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq  # 数据卷持久化，避免重启丢队列
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 本地镜像仓库（P0 补做：k3s 阶段 imagePullPolicy: IfNotPresent 配套）
  #   地址：localhost:5000；tag 规则：localhost:5000/tims/{svc}:{ver}
  # -----------------------------------------------------------------
  registry:
    image: registry:2
    container_name: tims-registry
    mem_limit: 128m
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  nacos-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  rabbitmq-data:
  registry-data:
